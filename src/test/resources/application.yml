spring:
  application:
    name: 'prsdb-webapp'
  cloud:
    aws:
      region:
        static: eu-west-2
  mvc:
    format:
      date: "d MMMM yyyy"
  servlet:
    multipart:
      enabled: false

one-login:
  jwt:
    public.key: classpath:public_key.pem
    private.key: classpath:private_key.pem
  did.uri: https://example.com/.well-known/did.json

notify:
  api-key: ${EMAILNOTIFICATIONS_APIKEY}
  support-email: support@example.com
  use-production-notify: false

argon2:
  iterations: 2
  memory: 16384
  parallelism: 1

base-url:
  landlord: example.com
  local-council: example.com

aws:
  s3:
    quarantineBucket: 'quarantine-bucket'
    safeBucket: 'safe-bucket'
    signatureDuration: '1h'

plausible:
  site-id: test-site-id
  domain-id: test-domain-id
  base-url: https://plausible.test
  api-key: test-api-key
  transaction-event-start-date: 2099-01-01

cloudwatch-metrics:
  ecs:
    namespace: AWS/ECS
    memory-utilisation-metric: MemoryUtilization
    cpu-utilisation-metric: CPUUtilization
    cluster-name: test-cluster
    service-name: test-service
  elasticache:
    namespace: AWS/ElastiCache
    cpu-utilisation-metric: CPUUtilization
    cache-cluster-id: test-cache-cluster
  cloudfront:
    namespace: AWS/CloudFront
    client-error-rate-metric: 4xxErrorRate
    server-error-rate-metric: 5xxErrorRate
    distribution-id: test-distribution

beta-feedback:
  team-email-address: feedback@example.com

os:
  api-key: ${OS_API_KEY}
  downloads.base-url: https://api.os.uk/downloads/v1

ff4j:
  web-console:
    enabled: false

features:
  feature-flags:
    - name: "failover-test-endpoints"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "subject-identifier-page"
      enabled: false
      expiry-date: "2027-03-30"
    - name: "pdjb-939-property-registration-restructure-and-skipping"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-939-property-registration-phase-two"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1053-dashboard-nav-link"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1022-delegate-to-letting-agent"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1664-password-benchmark-endpoint"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-1040-correspondence-address"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1009-payments"
      enabled: false
      expiry-date: "2026-12-31"
