spring:
  application:
    name: 'prsdb-webapp'

  thymeleaf:
    cache: false

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/prsdblocal
    username: postgres
    password: notarealpassword

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
      defer-datasource-initialization: true
      show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migrations
    validate-on-migrate: true

  sql:
    init:
      mode: always
      data-locations:
        - classpath:data-local.sql
        - classpath:data-metrics-local.sql
      continue-on-error: true

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      password: notarealpassword
      ssl:
        enabled: false

  cloud:
    aws:
      cloudwatch:
        enabled: false

one-login:
  jwt:
    # We provide a default for the keys if the env vars are missing: this allows us to keep the keys in uncommitted
    # files for local dev. In CI, however, we provide the data through env vars (from a secret store)
    public.key: ${ONE_LOGIN_PUBLIC_KEY:classpath:public_key.pem}
    private.key: ${ONE_LOGIN_PRIVATE_KEY:classpath:private_key.pem}
  did.uri: https://identity.integration.account.gov.uk/.well-known/did.json


notify:
  api-key: ${EMAILNOTIFICATIONS_APIKEY}
  use-production-notify: false

epc:
  base-url: https://api.epb-staging.digital.communities.gov.uk
  certificate-base-url: https://find-energy-certificate-staging.digital.communities.gov.uk/energy-certificate

server:
  port: ${SERVER_PORT:8080}
  error:
    path: /error

local:
  one-login-user-id: urn:fdc:gov.uk:2022:UVWXY
  emails:
    transientExceptionAddress: transient@example.com
    persistentExceptionAddress: persistent@example.com
  base-path-component: ${LOCAL_BASE_PATH_COMPONENT:}

argon2:
  iterations: 2
  memory: 16384
  parallelism: 1

base-url:
  landlord: http://localhost:${server.port}/landlord
  local-council: http://localhost:${server.port}/local-council

aws:
  s3:
    quarantineBucket: ${AWS_QUARANTINE_BUCKET:prsdb-quarantine-integration}
    safeBucket: ${S3_SAFE_BUCKET_KEY:prsdb-uploaded-files-integration}

management:
  endpoints:
    web:
      exposure:
        include: metrics,health,info

plausible:
  site-id: local-no-analytics
  domain-id: local-no-analytics
  base-url: http://localhost:${server.port}/local/plausible
  api-key: local-no-analytics

beta-feedback:
  team-email-address: Team-PRSDB@Softwire.com

features:
  overrides-enabled: true
  feature-flags:
    - name: "failover-test-endpoints"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "subject-identifier-page"
      enabled: true
      expiry-date: "2027-03-30"
    - name: "pdjb-939-property-registration-restructure-and-skipping"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-1053-dashboard-nav-link"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-1022-delegate-to-letting-agent"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-1664-password-benchmark-endpoint"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-1040-correspondence-address"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-1009-payments"
      enabled: true
      expiry-date: "2026-12-31"

---

spring:
  config:
    activate:
      on-profile: local-org-landlord

local:
  one-login-user-id: urn:fdc:gov.uk:2022:ORG01

---

spring:
  config:
    activate:
      on-profile: local-no-auth

  security:
    oauth2:
      client:
        registration:
          one-login:
            client-id: l0AE7SbEHrEa8QeQCGdml9KQ4bk
            client-authentication-method: private_key_jwt
            authorization-grant-type: authorization_code
            scope: openid
            redirect-uri: http://localhost:${server.port}/login/oauth2/code/one-login
          internal-access:
            client-id: 902e8a06-4086-423d-8e67-3838c4e52d7f
            client-secret: local-dev-secret
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid,email,profile
            redirect-uri: http://localhost:${server.port}/local-council/login/oauth2/code/internal-access
          epc-register:
            client-id: cb34efcd-4e22-439f-a15e-fcb8abdf73a2
            client-secret: ${EPC_REGISTER_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
        provider:
          one-login:
            authorization-uri: http://localhost:${server.port}/local/one-login/authorize
            token-uri: http://localhost:${server.port}/local/one-login/token
            jwk-set-uri: http://localhost:${server.port}/local/one-login/.well-known/jwks.json
            user-info-uri: http://localhost:${server.port}/local/one-login/userinfo
            userNameAttribute: "sub"
          internal-access:
            authorization-uri: http://localhost:${server.port}/local/internal-access/authorize
            token-uri: http://localhost:${server.port}/local/internal-access/token
            jwk-set-uri: http://localhost:${server.port}/local/internal-access/.well-known/jwks.json
            user-info-uri: http://localhost:${server.port}/local/internal-access/userinfo
            userNameAttribute: "sub"
          epc-register:
            token-uri: https://api.epb-staging.digital.communities.gov.uk/auth/oauth/token

one-login.did.uri: http://localhost:${server.port}/local/one-login/.well-known/did.json

---

spring:
  config:
    activate:
      on-profile: local-no-auth-unverified

local:
  id-verification-user-info-file: src/main/kotlin/uk/gov/communities/prsdb/webapp/local/api/mockOneLoginResponses/unverifiedUserInfo.json

---

spring:
  config:
    activate:
      on-profile: local-auth

  security:
    oauth2:
      client:
        registration:
          one-login:
            client-id: l0AE7SbEHrEa8QeQCGdml9KQ4bk
            client-authentication-method: private_key_jwt
            authorization-grant-type: authorization_code
            scope: openid
          internal-access:
            client-id: 902e8a06-4086-423d-8e67-3838c4e52d7f
            client-secret: ${INTERNAL_ACCESS_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid,email,profile
            redirect-uri: http://localhost:${server.port}/local-council/login/oauth2/code/internal-access
          epc-register:
            client-id: cb34efcd-4e22-439f-a15e-fcb8abdf73a2
            client-secret: ${EPC_REGISTER_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
        provider:
          one-login:
            issuer-uri: https://oidc.integration.account.gov.uk/
          internal-access:
            issuer-uri: https://sso.service.security.gov.uk
          epc-register:
            token-uri: https://api.epb-staging.digital.communities.gov.uk/auth/oauth/token

---

spring:
  config:
    activate:
      on-profile: nft-data-seeder

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  sql:
    init:
      mode: never

# Small volumes so the seeder can be run and reset locally. The deployed NFT
# environment uses the full-scale defaults from application.yml.
# Addresses are generated locally because the real NGD address data requires an OS API key and a large download.
nft-seed:
  system-operators: ${NFT_SEED_SYSTEM_OPERATORS:5}
  local-council-users: ${NFT_SEED_LOCAL_COUNCIL_USERS:10}
  landlords: ${NFT_SEED_LANDLORDS:30}
  properties: ${NFT_SEED_PROPERTIES:45}
  batch-size: ${NFT_SEED_BATCH_SIZE:10}
  generated-addresses: ${NFT_SEED_GENERATED_ADDRESSES:500}
