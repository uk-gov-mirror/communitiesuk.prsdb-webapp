    payForYourProperties: Pay for your properties
deleteIncompleteProperties:
  areYouSure:
    heading: 'Are you sure you want to delete {0,,address} from the database?'
    radios:
      error:
        missing: Select whether you want to delete this property from the database
  confirmation:
    banner:
      heading: You have deleted an incomplete property
    paragraph:
      one: You have deleted an incomplete property from the database.
      two: 'If you want to register the property, you will need to add any details about the property again.'
    button:
      text: Return to incomplete properties
submitRegistration: Submit registration
confirmMissingCompliance:
  heading: Confirm missing compliance certificates
  warning: You can be fined or prosecuted for not having these certificates.
  intro: This property is occupied by tenants, but it’s missing compliance certificates. These certificates keep tenants safe and are required by law.
  gas:
    heading: Missing valid gas safety certificate
    paragraph: A valid gas safety certificate shows that a Gas Safe engineer has checked the gas supply and appliances within the last 12 months.
    withoutCertificate: 'Without this certificate, you can be:'
    bullet:
      one: fined an unlimited amount
      two: sent to prison
  electrical:
    heading: Missing valid electrical safety certificate
    paragraph: A valid electrical safety certificate shows that an electrician has checked the electrics in the last 5 years.
    withoutCertificate: 'Without this certificate, you can be:'
    bullet:
      one: fined or prosecuted
      two: ordered to fix electrical problems
  epc:
    heading: Missing valid EPC
    paragraph: A valid EPC shows that the property meets the minimum energy efficiency standards for rental properties.
    withoutCertificate: 'Without this certificate, you can be:'
    bullet:
      one: fined or prosecuted
      two: unable to use grounds for possession to evict a tenant
  areYouSure:
    heading: Are you sure you want to submit this registration?
    hint: The local council will be able to see that certificates are missing
  radios:
    'yes': Yes (at risk of prosecution or fine)
    'no': 'No, go back'
    error:
      missing: Select whether you want to submit this registration
  button: Confirm and submit
provideLicensingLater:
  occupied:
    heading: Provide details about property licensing later
    paragraph:
      one: You can continue and submit your registration now, but you’ll need to return later and provide details about this property’s license.
    whenToAdd:
      heading: When you must do this by
      insetText: To keep your property registered, you must provide its licensing details within 28 days.
      paragraph: This is because you’ve told us this property’s occupied by tenants.
  unoccupied:
    heading: Provide details about property licensing later
    paragraph:
      one: If you’re unsure, check with the local council if your property needs a license to be rented out.
    whenToAdd:
      heading: When you’ll need to provide these property licensing details
      paragraph:
        one: You can continue to finish your registration and get a Property Registration Number.
        two: 'Once your property’s occupied, you have 28 days to return and tell us:'
  weWillNeedToKnow:
    intro: 'We’ll need to know:'
    bullet:
      one: if your property needs a license or not
      two: details about the license (if your property needs one)
correspondenceEmail:
  heading: Where should the council send emails?
  hint: This is the email address the council will use if they need to contact someone about the property
  radios:
    error:
      missing: Select which email address the council should send emails to
    option:
      accountEmail:
        label: The email address from my account
      differentEmail:
        label: A different email address (must belong to you or another landlord)
        input:
          label: Email address
          error:
            missing: Enter an email address
            invalidFormat: Enter an email address in the correct format, like name@example.com
propertyManager:
  usingPropertyManager:
    heading: Property manager
    paragraph: 'Tell us if you use a person or company for day-to-day tasks, like:'
    bullet:
      one: collecting the rent
      two: completing property inspections
      three: organising repairs and compliance checks
    insetText: This does not include any letting agents who are only advertising the property for you.
    fieldSetHeading: Are you using a property manager?
    radios:
      'no': No, I manage this property (or another joint landlord does)
      error:
        missing: Select if you are using a property manager
  todo:
    removePropertyManager:
      heading: 'TODO (PDJB-1983): Are you sure you want to remove your property manager?'
    radios:
      error:
        missing: 'TODO (PDJB-1983): Select yes or no'
paymentDescription: Register your rental property
paymentSummary:
  heading: Property fee
  annualFee: The annual property fee is {0}. You are paying an adjusted (pro-rated) fee.
  preGratisPeriod: There is no charge for the service until {0}. You are paying for {0} to your renewal date.
  postGratisPeriod: You are paying for {0} to your renewal date.
  renewalDateExplanation: Your renewal date is 1 year from when you registered your first property.
  summary:
    heading: Payment summary
    address: Property address
    payment: Payment
    paymentDate: Payment date
    renewalDate: Renewal date
  prnHint: Your property will be registered when you pay and you will be given a Property Registration Number.
  button: Go to payment
paymentProcessing:
  heading: Your payment is processing
  js:
    doNotClose: Do not close or refresh this tab.
    redirect: When your payment is processed you will be automatically redirected.
  noJs:
    notConfirmed: We have not yet received confirmation that your payment was successful.
    checkStatus: Select Check payment status to see if your payment has been completed.
    button: Check payment status
paymentFailed:
  heading: Your payment has been declined
  contactBank: Contact your bank for more details. No money has been taken from your account.
  notRegistered: Your property has not been registered. You must pay the property fee to complete your property registration.
  tryAgainLink: Go back to try the payment again.
  getHelp: Get help with payment
whoProvidesRentalDetails:
  heading: Who will provide details about how your property’s rented out
  intro: 'To register your property, we need details about:'
  bullet:
    licensing: if your property needs a license
    complianceCertificates: compliance certificates
    tenancy: the current tenancy
  lettingAgentParagraph: If you’re using a letting agent or property manager, you can choose for them to provide these details for you. They can also keep these details up to date.
  fieldSetHeading: Who will provide this property’s rental details?
  radios:
    error:
      missing: Select who will provide this property’s rental details
    option:
      landlord:
        label: I will provide these details
      lettingAgent:
        label: My letting agent or property manager
        hint: Give them access to provide these details
  changeToLettingAgent:
    heading: Are you sure you want to change this?
    pageTitle: Are you sure you want your letting agent to provide details?
    paragraph:
      one: You’ve selected for your letting agent or property manager to provide details about how your property’s rented out.
      two: 'This means we’ll remove the details you’ve already provided about:'
      three: You can go back to undo this change.
    bullet:
      one: property licensing
      two: compliance certificates
      three: the current tenancy
lettingAgentEmail:
  heading: Allow your letting agent or property manager to provide details
  howItWorks:
    heading: How it works
    step1: "You’ll enter your letting agent or property manager’s email address, then skip to paying for this property."
    step2: "We’ll ask your letting agent or property manager to provide the licensing, compliance certificates and tenancy details."
    step3: They can keep these details up to date for you.
  canRemove: You can remove your letting agent or property manager at any time.
  responsible:
    heading: You remain responsible for this registration
    body: "You should always check that your registration is correct. We’ll email you whenever your letting agent or property manager makes an update."
  insetText: "You must check that all your property’s details are provided within 28 days. We’ll email you if no one has added these details after 14 days."
  emailLabel: "What is your letting agent or property manager’s email address?"
  emailHint: "We’ll email them a link to provide this property’s remaining details"
  submitButton: Save and continue
occupancyChangeInterruption:
  heading: Are you sure you want to change this?
  pageTitle: Are you sure you want to change this property to unoccupied?
  paragraph:
    one: You’ve changed this property to being unoccupied.
    two: This means you cannot ask your letting agent or property manager to provide this property’s details.
    three: You must now complete this registration yourself, adding as many details as you can.
    four: When the property’s occupied, you can add a letting agent or property manager again. They can provide any missing details for you.
    five: You can go back to undo this change.
