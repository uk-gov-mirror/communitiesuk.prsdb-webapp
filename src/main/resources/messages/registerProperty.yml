heading: Register a property
intro:
  paragraph: 'You’ll need to know:'
  bullet:
    one: 'basic information about the property, like whether it’s a house or flat'
    two: 'details about the property’s rental licence, if it has one'
certificates:
  paragraph:
    one: We’ll ask for gas safety, electrical safety and energy performance certificates. You can register without these certificates, but you must provide them later.
    two: Check the information you add is accurate and up to date.
ifOccupied:
  heading: If your property is occupied
  paragraph: 'We’ll ask for further details, like:'
  bullet:
    one: how many people live in the property
    two: the rent you charge
provideTenancyDetailsLater:
  heading: Provide tenancy details later
  paragraph:
    one: You can continue and submit your registration now, but you’ll need to return later and provide details about the current tenancy.
  whenToProvide:
    heading: When you’ll need to provide these tenancy details
    insetText: To keep your property registered, you must provide its tenancy details within 28 days.
    paragraph: This is because you’ve told us this property’s occupied by tenants.
  reason: 'We’ll need to know:'
  weWillNeedToKnow:
    bullet:
      one: how many people are living in the property
      two: if you’ve provided furniture
      three: how much the rent is
afterRegistered:
  heading: After you’ve registered
  paragraph:
    one: 'You’ll get a <strong>Property Registration Number</strong>.'
    two: You must put this number on any adverts to rent this property, along with each landlord’s Landlord Registration Number.
  insetText: You need to keep your property’s registration up to date.
confirmation:
  banner:
    heading: Property registered
  prn:
    label: 'Your <strong>Property Registration Number</strong> is:'
  keepNumber: We’ve sent you a confirmation email including this number.
  useInAdverts: Use this Property Registration Number when advertising this property, alongside each landlord’s Landlord Registration Number.
  paymentSummary:
    heading: Payment summary
    payment: Payment
    paymentDate: Payment date
    renewalDate: Renewal date
  whatYouNeedToDoNext:
    heading: What you need to do next
    uploadCompliance:
      heading: Upload compliance certificates
      paragraph: 'To keep this property registered, upload its certificates <strong>before {0}</strong>.'
  whatHappensNext:
    heading: What happens next
    lettingAgent:
      subHeading: Your letting agent or property manager needs to provide the remaining required details
      emailedParagraph: "We’ve now emailed your letting agent or property manager and asked them to provide:"
      licensingDetails: licensing details
      gasSafetyCertificate: gas safety certificate
      electricalSafetyCertificate: electrical safety certificate
      epc: energy performance certificate (EPC)
      tenancyDetails: tenancy details
      completeByParagraph: To keep the property registered, they must provide these details before {0}. We’ll notify you when they’ve provided this information.
  provideMissingDetails:
    heading: Providing missing details
    paragraph:
        one: 'You still need to provide the:'
        two: To keep the property registered, provide these details before {0}.
    licensingDetails: licensing details
    gasSafetyCertificate: gas safety certificate
    electricalSafetyCertificate: electrical safety certificate
    epc: energy performance certificate (EPC)
    tenancyDetails: tenancy details
  goToDashboard: Go to dashboard
  feedback:
    body: 'Answer a few short questions about <strong>property registration</strong>.'
taskList:
  heading: Register a rental property
  subtitle: Your answers are saved as you go. You can return and finish this later.
  gasSafety: Gas safety certificate
  electricalSafety: Electrical safety certificate
  epc: Energy performance certificate (EPC)
  aboutYourProperty:
    heading: About your property
    propertyDetails: Property details
    ownershipAndLandlords: Ownership and landlords
    correspondence: Who the council should contact
    occupied: Tell us if your property’s occupied
  rentedOut:
    heading: How your property’s rented out
    whoProvidesDetails: Who will provide these details
    whoProvidesDetailsOccupiedHint: If you’re using a letting agent or property manager, they can provide the rest of this section
    whoProvidesDetailsNotRequiredHint: Once your property’s occupied, your letting agent or property manager can keep these details updated for you
    licensing: Tell us if your property needs a license
    tenancyDetails: Tenancy details
    tenancyDetailsNotNeededYetHint: Once your property’s occupied, you’ll need to provide details about the tenancy
    lettingAgentProvidesHint: The letting agent will provide these details
  submitYourRegistration:
    heading: Submit your registration
    headingWithPayment: Submit and pay
  checkAndSubmit:
    checkAnswers: Check and submit your answers
    checkAnswersWithPayment: Submit and pay
