title: Set up your letting agent account
caption: Provide details for a landlord’s rental property
hasPassword:
  fieldSetHeading: "TODO: PDJB-1658: Check password set step"
  radios:
    hasPassword: Has password set # pragma: allowlist secret
    noPassword: No password set # pragma: allowlist secret
    error:
      missing: Select whether this account has a password set
setPassword:
  heading: Set your password for this property
  intro: "A landlord has given you access to provide details for this rental property:"
  explanation: To continue, create a password. You’ll use this password when you come back and update the property’s registration.
  warning: You cannot change this password later.
  password:
    label: Enter a password
    hint: Must be at least 8 characters and include letters and numbers
    error:
      missing: Enter a password
      invalid: Password must be at least 8 characters and include letters and numbers
      mismatch: Enter the same password in both fields
  confirmPassword:
    label: Re-type password
    error:
      missing: Re-type your password
  submit: Save and continue
enterPassword:
  heading: Enter the password for this property
  password:
    label: Password
    error:
      missing: Enter your password
      incorrect: The password you entered is not correct
  submit: Continue
  details:
    summary: I do not know this password
    intro: To set a new password, ask the landlord to send you a new link.
    heading: What the landlord needs to do
    listIntro: "Ask a landlord to:"
    step:
      one: Sign into the Register your rental property service.
      two: Go to this property’s record.
      three:
        textOne: "Under "
        boldOne: Your letting agent or property manager can make updates
        textTwo: " select to "
        boldTwo: Remove your letting agent or property manager
        textThree: ". Complete these steps."
      four:
        textOne: "Under "
        boldOne: If you’re using a letting agent or property manager
        textTwo: ", select "
        boldTwo: Allow them to provide details
        textThree: ". Complete these steps."
