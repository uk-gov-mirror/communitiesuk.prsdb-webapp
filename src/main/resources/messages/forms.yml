propertyType:
  fieldSetHeading: What type of property are you registering?
  radios:
    option:
      detachedHouse:
        label: Detached house
        hint: A standalone house not connected to any other buildings
      semiDetachedHouse:
        label: Semi-detached house
        hint: A house connected to one other house
      terracedHouse:
        label: Terraced house
        hint: 'A house in a row of similar houses, sharing walls with neighbours on both sides'
      flat:
        label: Flat
        hint: 'An individual home within a larger building of other homes, often with shared entrances and facilities'
      other:
        label: Other
        hint: The property type is not listed
        input:
          label: Enter the property type
          error:
            missing: Enter the property type
    error:
      missing: Select the type of property
ownershipType:
  fieldSetHeading: Select the type of ownership you have for your property
  radios:
    option:
      freehold:
        label: Freehold
        hint: You have ownership of a property for an indefinite time.
      leasehold:
        label: Leasehold
        hint: You have a legal agreement with a landlord (sometimes known as the ‘freeholder’ for a fixed period of time) called a ‘lease’. Most flats are leasehold.
      shareOfFreehold:
        label: Share of freehold
        hint: You have a lease and own some of the whole building with other owners.
      commonhold:
        label: Commonhold
        hint: 'You own your property for an indefinite time and share management of the building or estate with other owners, following rules in a Commonhold Community Statement.'
    error:
      missing: Select the ownership type
  details:
    summary:
      text: Why do I need to select the type of ownership?
    text: This helps local councils know who is responsible for repair work on the property.
occupancy:
  radios:
    error:
      missing: Select whether the property is occupied
    option:
      'yes':
        hint: One or more tenants live in the property
      'no':
        hint: There are no tenants living in the property
  fieldSetHeading: Is your property occupied by tenants?
  fieldSetHint: What you choose here decides which compliance and rent details you need to add.
numberOfHouseholds:
  heading: Households in your property
  paragraph:
    one: The number of households in your property helps local authorities understand if your property needs a House in Multiple Occupation (HMO) licence.
    two: 'A household is:'
    three: 'A family includes people who are:'
    four: Unrelated adults who are not a couple are separate households.
  'heading.two': What is a household?
  bullet:
    point:
      one: one person living alone
      two: a family living together
      three: married or living together as a couple
      four: 'related (parents, children, siblings, aunts, uncles, cousins)'
  label: Enter how many households live in your property
  restructureAndSkipping:
    heading: Households in your property
    paragraph:
      one: The number of households in your property helps local councils understand if your property needs a House in Multiple Occupation (HMO) licence.
      two: 'A household is one person living alone or a family living together. A family includes people who are:'
      three: Unrelated adults (who are not a couple) are separate households.
    bullet:
      point:
        one: married
        two: related (like aunts or cousins)
        three: living together as a couple
    questionHeading: How many households are in your property?
    input:
      error: 'Enter how many separate households, like 1 or 2'
    label: Enter how many households live in your property
numberOfPeople:
  input:
    error:
      invalidFormat: 'Enter how many people, like 2 or 5'
      invalidNumber: The number of people in the property must be the same as or higher than the number of households in the property
  fieldSetHeading: How many people live in your property?
  fieldSetHint: Include everyone who lives there permanently, even if they are not related. You must include children and babies.
  paragraph: 'Do not include anyone staying temporarily, such as:'
  bullet:
    one: guests staying for less than 90 days
    two: people on holiday
    three: people who have another main home elsewhere
  label: Enter the number of people living in your property
  details:
    summary: Why do I need to declare this?
    text: Your council may use this information to check your property is not overcrowded.
numberOfBedrooms:
  input:
    error: 'Enter the number of bedrooms, like 3 or 8'
  heading: How many bedrooms in your property?
  paragraph:
    one: A bedroom is any room built or converted for sleeping, even if it is currently being used for another purpose (such as an office).
    two: In an HMO, a bedroom is any room built or converted for sleeping. To be counted, a room must meet the minimum floor area and natural light requirements set by your local council and be for the tenant’s exclusive use.
    three: 'Do not include:'
  bullet:
    one: kitchens or bathrooms
    two: landings and hallways
    three: any room smaller than 4.64 square metres
  details:
    summary: Where to find this information
    text: If your property is an HMO with an active licence, you may find it helpful to consult your licence documentation. This will confirm the maximum number of bedrooms and occupants permitted for the property.
  label: Enter the number of bedrooms
rentIncludesBills:
  radios:
    error:
      missing: Select whether the rent includes bills
  fieldSetHeading: Does the rent include bills?
  fieldSetHint: 'This could include gas, electricity, water, broadband, Council Tax or cleaning.'
billsIncluded:
  error:
    missing: Select what you include in the rent
    somethingElse:
      missing: Enter the bills and services you include in the rent
      tooLong: The description of other bills and services must be 200 characters or fewer
  fieldSetHeading: Which of these do you include in the rent?
  fieldSetHint: Select the bills and services included.
  checkbox:
    gas: Gas
    electricity: Electricity
    water: Water
    councilTax: Council Tax
    landline: Landline
    broadband: Broadband
    tvLicence: TV licence
    cableSatelliteTV: Cable or satellite TV
    parking: Parking
    gardening: Gardening
    communalAreasCleaner: Cleaner for communal areas
    somethingElse: Something else
    'somethingElse.label': Add the bills and services included in the rent
furnishedStatus:
  radios:
    error:
      missing: Select whether the property is furnished, partly furnished or unfurnished
    options:
      furnished:
        label: Furnished
        hint: The property includes all flooring, window coverings, white goods, and all essential furniture (such as beds, sofas, and a dining table)
      partFurnished:
        label: Partly furnished
        hint: The property includes all flooring and window coverings. It may include white goods, but only some furniture
      unfurnished:
        label: Unfurnished
        hint: The property includes flooring and window coverings, but no furniture or white goods (like a fridge or washing machine)
  fieldSetHeading: Is the property furnished?
  fieldSetHint: Select the option that best describes what is provided with the property.
rentFrequency:
  heading: When you charge rent
  subheading: When to take payment
  paragraph:
    one: The rent charge is the actual amount your tenants pay. This may be different from the price you advertised.
    two: 'You must:'
  bullet:
    one: only ask for rent payments once both you and the tenant have signed the tenancy agreement
    two: ensure you receive rent on the specific date set out in the agreement
  warningText: You can ask for rent in advance after the contract is signed but before the tenancy starts. This is limited to one month’s rent, or 28 days if rent is paid at any other interval, such as weekly or every 4 weeks.
  fieldSetHeading: How often do you charge rent?
  label: Select how often you will receive rent payments.
  radios:
    option:
      monthly:
        label: Monthly
        hint: You receive rent on the same date each month (for example, 15 March, then 15 April)
      fourWeekly:
        label: 4 weekly
        hint: You receive rent every 28 days. This means you receive 13 payments a year (for example, 15 March, then 12 April)
      weekly:
        label: Weekly
        hint: You receive rent once every 7 days
      other:
        label: Other
        hint: Select this if you receive rent at a different interval, such as quarterly or annually
        input:
          label: Give details of the rent frequency
          error:
            missing: Enter how often you charge rent
    error:
      missing: Select how often you charge rent
rentAmount:
  heading:
    weekly: What is the weekly rent?
    fourWeekly: What is the 4-weekly rent?
    monthly: What is the monthly rent?
  subheading:
    weekly: Weekly rent
    fourWeekly: 4-weekly rent
    monthly: Monthly rent
  paragraph:
    one:
      weekly: The amount you enter must be the total weekly rent agreed with the tenant.
      fourWeekly: The amount you enter must be the total 4-weekly rent agreed with the tenant.
      monthly: The amount you enter must be the total monthly rent agreed with the tenant.
    two: 'You must include:'
    three: 'Do not include:'
    four: Enter the amount in pounds. For example, 705 or 705.50
  bullet:
    one: the agreed rent
    two: the rent for the whole property (if the property is an HMO, do not enter the price per room)
    three: any bills or services included in the rent, such as gas, electricity or cleaning
    four: rent arrears
    five: rent in advance payments
  conditionalSection:
    paragraph:
      one: 'To work out the monthly equivalent, divide your rent amount by the number of months it covers. For example:'
    bullet:
      one: if you charge a 6-monthly amount of £3,000, divide £3,000 by 6.
      two: the equivalent monthly amount is £500
  fieldSetHint: Do not use the £ sign or commas.
  error: Rent amount must only include numbers (and a decimal point), like 600 or 193.54
licensingType:
  fieldSetHeading: Select the type of licence you have for your property
  fieldSetHint: Select which type of property licence applies to this property
  radios:
    error:
      missing: Select the type of licensing for the property
    option:
      selectiveLicence:
        label: Selective licence
        hint: Some local councils require this licence for any privately rented homes in specific areas.
      hmoMandatory:
        label: HMO mandatory licence
        hint: A House in Multiple Occupation (HMO) must have a licence if it’s occupied by 5 or more people who form more than 1 household.
      hmoAdditional:
        label: HMO additional licence
        hint: Some local councils require a licence for smaller HMOs that are not covered by the mandatory licensing licence.
      noLicensing:
        label: This property does not need a licence
licenceNumber:
  error:
    tooLong: The licensing number is too long
selectiveLicence:
  error:
    missing: Enter the selective licence number
  fieldSetHeading: What is your selective licence number?
  label: Enter the selective licence number
  detail:
    summary: What is selective licensing?
    text: Some local councils issue a selective licensing number for privately rented housing in a local area.
hmoMandatoryLicence:
  error:
    missing: Enter the HMO Mandatory licence number
  fieldSetHeading: What is your HMO mandatory licence number?
  label: Enter the HMO mandatory licence number
  detail:
    summary: What is a House in Multiple Occupation (HMO) licence?
    paragraph:
      two: 'If you want to rent out your property as a house in multiple occupation in England or Wales, you must contact your council to check if you need a licence.'
      three: 'You must have a HMO licence if you’re renting out a large HMO, which means:'
    bullet:
      one: it’s rented to 5 or more people who form more than 1 household
      two: 'some or all tenants share toilet, bathroom or kitchen facilities'
      three: at least 1 tenant pays rent (or their employer pays it for them)
hmoAdditionalLicence:
  error:
    missing: Enter the HMO additional licence number
  fieldSetHeading: What is your HMO additional licence number?
  label: Enter the HMO additional licence number
  detail:
    summary: What’s a HMO additional licence?
    paragraph:
      two: Some local council areas require licensing on different types of HMOs in its area which are not subject to mandatory licensing.
      three: Contact the local council your property is in to understand whether your property needs an HMO additional licence.
hmoShared:
  detail:
    paragraph:
      one:
        beforeLink: A property is a
        link:
          text: house in multiple occupation (HMO) (opens in new tab)
        afterLink: 'if both of the following apply:'
    bullet:
      one: 'it’s rented to at least 3 tenants who are not from 1 ‘household’ (for example, a family)'
      two: 'tenants share toilet, bathroom or kitchen facilities'
