gasSafety:
  error:
    missing: Select whether you have a gas safety certificate
invalidGasSafety:
  whatNext:
    heading: What you need to do next
    one:
      beforeLink: Make sure gas equipment in the property is safely installed and maintained by a
      link: Gas Safe registered (opens in new tab)
      afterLink: engineer.
    two: 'Get an updated, valid certificate.'
    three: Upload the certificate to the database.
    four: 'Give a copy of the certificate to existing tenants within 28 days of the check, and to new tenants before they move in.'
  ifNoCert:
    heading: If you do not have a valid certificate
    paragraph:
      one: 'If you do not have a valid certificate, you commit a criminal offence under health and safety law.'
      two:
        beforeLink: Read about
        link: gas safety for landlords (opens in new tab)
        afterLink: to understand more about your responsibilities.
      three: 'In the meantime, you can add other compliance information to the database.'
    bullet:
      heading:
        beforeLink: Your local council or the
        link: Health and Safety Executive (opens in new tab)
        afterLink: 'can take enforcement action, which can lead to:'
      one: prosecution
      two: unlimited fines
      three: 'imprisonment, in the most serious cases'
invalidEicr:
  whatNext:
    heading: What you need to do next
    one:
      beforeLink: Get a new electrical inspection
      afterLink: .
    two: Review and fix any problems the inspection finds
    three: Upload the new EICR to the database.
    four: 'Give a copy of the certificate to existing tenants within 28 days of the check, and to new tenants before they move in.'
    paragraph:
      beforeLink: 'For full details, read the'
      link: electrical safety standards in the private rented sector (opens in new tab)
      afterLink: .
  ifNoEicr:
    heading: If you do not have a valid EICR
    paragraph:
      one: Your local council can contact you if you do not have a valid EICR.
      three: 'In the meantime, you can add other compliance information to the database.'
    bullet:
      heading: 'They can also:'
      one: order you to fix any electrical problems
      two: do remedial work on your property and charge you for it
      three: 'fine you up to £30,000'
uploadCertificate:
  gasSafety:
    fieldSetHeading: Upload the gas safety certificate
    error:
      missing: Select a gas safety certificate
  eicr:
    fieldSetHeading: Upload the Electrical Installation Condition Report (EICR)
  eic:
    fieldSetHeading: Upload the Electrical Installation Certificate (EIC)
  electricalSafety:
    error:
      missing: Select an electrical safety certificate
  label: Upload a file
  error:
