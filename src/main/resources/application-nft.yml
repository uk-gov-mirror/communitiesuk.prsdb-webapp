spring:
  sql:
    init:
      data-locations:
        - classpath:data-test.sql
        - classpath:data-nft-performance.sql

features:
  overrides-enabled: true
  feature-flags:
    - name: "failover-test-endpoints"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "subject-identifier-page"
      enabled: true
      expiry-date: "2027-03-30"
    - name: "pdjb-939-property-registration-phase-two"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1664-password-benchmark-endpoint"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-238-gatling-post-endpoint"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-1009-payments"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1210-multi-user-organisations"
      enabled: false
      expiry-date: "2026-11-01"
    - name: "pdjb-1894-gas-certificate-14-month-expiry"
      enabled: false
      expiry-date: "2026-12-31"

argon2:
  iterations: 2
  memory: 19456
  parallelism: 1

---

spring:
  config:
    activate:
      on-profile: one-login-simulator

  security:
    oauth2:
      client:
        registration:
          one-login:
            client-id: ${ONE_LOGIN_SIMULATOR_CLIENT_ID}
        provider:
          one-login:
            issuer-uri: ${ONE_LOGIN_SIMULATOR_ISSUER_URL}

one-login:
  jwt:
    public.key: ${ONE_LOGIN_SIMULATOR_PUBLIC_KEY}
    private.key: ${ONE_LOGIN_SIMULATOR_PRIVATE_KEY}
  did.uri: ${ONE_LOGIN_SIMULATOR_DID_URL}
