spring:
  application:
    name: 'prsdb-webapp'

  datasource:
    url: ${RDS_URL}
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}

    hikari:
      connection-init-sql: SET pg_trgm.strict_word_similarity_threshold = 0.7;

    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
      defer-datasource-initialization: true

  flyway:
    enabled: false

  mvc.format.date: "d MMMM yyyy"

  thymeleaf:
    render-hidden-markers-before-checkboxes: true
    servlet:
      produce-partial-output-while-processing: false

  servlet:
    multipart:
      enabled: false

one-login:
  jwt:
    public.key: ${ONE_LOGIN_PUBLIC_KEY}
    private.key: ${ONE_LOGIN_PRIVATE_KEY}
  did.uri: ${ONE_LOGIN_DID_URL}

notify:
  api-key: ${EMAILNOTIFICATIONS_APIKEY}
  support-email: ${EMAILNOTIFICATIONS_SUPPORTEMAIL:Team-PRSDB+virus-notification@softwire.com}
  use-production-notify: ${EMAILNOTIFICATIONS_USE_PRODUCTION_NOTIFY}

os:
  api-key: ${OS_API_KEY}
  downloads.base-url: https://api.os.uk/downloads/v1

epc:
  base-url: ${EPC_REGISTER_BASE_URL}
  certificate-base-url: ${EPC_CERTIFICATE_BASE_URL}

nft-seed:
  system-operators: ${NFT_SEED_SYSTEM_OPERATORS:150}
  local-council-users: ${NFT_SEED_LOCAL_COUNCIL_USERS:3000}
  landlords: ${NFT_SEED_LANDLORDS:2820000}
  properties: ${NFT_SEED_PROPERTIES:4700000}
  batch-size: ${NFT_SEED_BATCH_SIZE:10000}
  random-seed: ${NFT_SEED_RANDOM_SEED:239}
  # Blank means "now". Set to an ISO date (e.g. 2026-01-01) to make a run fully reproducible.
  reference-date: ${NFT_SEED_REFERENCE_DATE:}
  # Number of fictional addresses to generate before seeding. 0 uses the addresses already in the database (the real
  # NGD data loaded by NgdAddressLoader), which is what deployed NFT does.
  generated-addresses: ${NFT_SEED_GENERATED_ADDRESSES:0}

server:
  error:
    path: /error
  servlet:
    session:
      timeout: 1h
  tomcat:
    redirect-context-root: false
  forward-headers-strategy: native

aws:
  s3:
    signatureDuration: ${AWS_S3_SIGNATURE_DURATION:1h}
    quarantineBucket: ${AWS_QUARANTINE_BUCKET}
    safeBucket: ${S3_SAFE_BUCKET_KEY}

management:
  endpoints:
    web:
      exposure:
        include: ""
  cloudwatch:
    metrics:
      export:
        namespace: ${METRICS_CLOUDWATCH_NAMESPACE}
        step: 1m

argon2:
  iterations: 2
  memory: 19456
  parallelism: 1

base-url:
  landlord: ${LANDLORD_BASE_URL}
  local-council: ${LOCAL_COUNCIL_BASE_URL}

plausible:
  site-id: ${PLAUSIBLE_SITE_ID}
  domain-id: ${PLAUSIBLE_DOMAIN_ID}
  base-url: https://plausible.io
  api-key: ${PLAUSIBLE_API_KEY}
  # Date the Transaction custom event went live in production. Until set to the real go-live date, the
  # far-future default keeps the total-transactions metric on the legacy Flow-event counting method.
  transaction-event-start-date: ${PLAUSIBLE_TRANSACTION_EVENT_START_DATE:2099-01-01}

cloudwatch-metrics:
  ecs:
    namespace: ${CLOUDWATCH_ECS_NAMESPACE:AWS/ECS}
    memory-utilisation-metric: ${CLOUDWATCH_ECS_MEMORY_METRIC:MemoryUtilization}
    cpu-utilisation-metric: ${CLOUDWATCH_ECS_CPU_METRIC:CPUUtilization}
    cluster-name: ${CLOUDWATCH_ECS_CLUSTER_NAME:}
    service-name: ${CLOUDWATCH_ECS_SERVICE_NAME:}
  elasticache:
    namespace: ${CLOUDWATCH_ELASTICACHE_NAMESPACE:AWS/ElastiCache}
    cpu-utilisation-metric: ${CLOUDWATCH_ELASTICACHE_CPU_METRIC:CPUUtilization}
    cache-cluster-id: ${CLOUDWATCH_ELASTICACHE_CLUSTER_ID:}
  cloudfront:
    namespace: ${CLOUDWATCH_CLOUDFRONT_NAMESPACE:AWS/CloudFront}
    client-error-rate-metric: ${CLOUDWATCH_CLOUDFRONT_4XX_METRIC:4xxErrorRate}
    server-error-rate-metric: ${CLOUDWATCH_CLOUDFRONT_5XX_METRIC:5xxErrorRate}
    distribution-id: ${CLOUDFRONT_DISTRIBUTION_ID:}

beta-feedback:
  team-email-address: ${BETA_FEEDBACK_TEAM_EMAIL_ADDRESS}

ff4j:
  web-console:
    enabled: false

features:
  overrides-enabled: false
  feature-flags:
    - name: "failover-test-endpoints"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "subject-identifier-page"
      enabled: true
      expiry-date: "2027-03-30"
    - name: "pdjb-939-property-registration-restructure-and-skipping"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-939-property-registration-phase-two"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1053-dashboard-nav-link"
      enabled: true
      expiry-date: "2026-12-31"
    - name: "pdjb-1022-delegate-to-letting-agent"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1664-password-benchmark-endpoint"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1040-correspondence-address"
      enabled: false
      expiry-date: "2026-12-31"
    - name: "pdjb-1009-payments"
      enabled: false
      expiry-date: "2026-12-31"

---

spring:
  config:
    activate:
      on-profile: default

  security:
    oauth2:
      client:
        registration:
          one-login:
            client-id: ${ONE_LOGIN_CLIENT_ID}
            client-authentication-method: private_key_jwt
            authorization-grant-type: authorization_code
            scope: openid
          internal-access:
            client-id: ${INTERNAL_ACCESS_CLIENT_ID}
            client-secret: ${INTERNAL_ACCESS_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/local-council/login/oauth2/code/internal-access"
          epc-register:
            client-id: ${EPC_REGISTER_CLIENT_ID}
            client-secret: ${EPC_REGISTER_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope:
        provider:
          one-login:
            issuer-uri: ${ONE_LOGIN_ISSUER_URL}
          internal-access:
            issuer-uri: ${INTERNAL_ACCESS_ISSUER_URL}
          epc-register:
            token-uri: ${EPC_REGISTER_TOKEN_URI}

  data:
    redis:
      host: ${ELASTICACHE_URL}
      port: ${ELASTICACHE_PORT}
      password: ${ELASTICACHE_PASSWORD}
      ssl:
        enabled: true

  sql:
    init:
      mode: always
      platform: ${ENVIRONMENT_NAME}
      continue-on-error: true

---

spring:
  config:
    activate:
      on-profile: web-server-deactivated

  main:
    web-application-type: none
