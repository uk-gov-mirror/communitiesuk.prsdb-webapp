<div th:fragment="passwordInput(label, fieldName, hint, autocomplete)"
     class="govuk-form-group govuk-password-input"
     th:classappend='${#fields.hasErrors(fieldName) ? "govuk-form-group--error" : ""}'
     data-module="govuk-password-input">
    <label class="govuk-label" th:for="__${fieldName}__" th:utext="${label}">label</label>
    <div th:if="${hint}" th:id="__${fieldName}__+'-details-hint'" class="govuk-hint" th:text="${hint}">hint</div>
    <p th:if="${#fields.hasErrors(fieldName) && #fields.errors(fieldName)[0] != '_'}" th:id="__${fieldName}__+'-error'" class="govuk-error-message">
        <span class="govuk-visually-hidden" th:text="#{forms.errorMessage.prefix}">forms.errorMessage.prefix</span>
        <span th:text="#{${#fields.errors(fieldName)[0]}}">fields.errors(fieldName)[0]</span>
    </p>
    <div class="govuk-input__wrapper govuk-password-input__wrapper">
        <input class="govuk-input govuk-password-input__input govuk-js-password-input-input"
               th:classappend='${#fields.hasErrors(fieldName) ? "govuk-input--error" : ""}'
               type="password"
               spellcheck="false"
               autocapitalize="none"
               th:attr="autocomplete=${autocomplete}"
               th:field="*{__${fieldName}__}"
               th:attrappend="aria-describedby=${hint != null} ? ${fieldName}+'-details-hint'">
        <button type="button"
                class="govuk-button govuk-button--secondary govuk-password-input__toggle govuk-js-password-input-toggle"
                data-module="govuk-button"
                th:attr="aria-controls=__${fieldName}__"
                aria-label="Show password"
                hidden
                th:text="#{forms.passwordInput.showPassword}">
            forms.passwordInput.showPassword
        </button>
    </div>
</div>
